server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config: never cache, so a changed API_BASE_URL takes effect on the next page load.
    location = /env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /holds/h_123 after a refresh) serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
